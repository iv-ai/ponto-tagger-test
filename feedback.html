<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ponto Tagger Test — Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; }
    .tag-badge { display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
    .tag-ready      { background: #dcfce7; color: #15803d; }
    .tag-design     { background: #f3e8ff; color: #7e22ce; }
    .tag-regenerate { background: #fef9c3; color: #a16207; }
    .tag-newinput   { background: #dbeafe; color: #1d4ed8; }
    .tag-flagged    { background: #fee2e2; color: #b91c1c; }
    .tag-empty      { background: #f1f5f9; color: #94a3b8; }
    .item-img { width: 80px; height: 60px; object-fit: cover; border-radius: 5px; border: 1px solid #e2e8f0; cursor: pointer; flex-shrink: 0; }
    .item-img:hover { opacity: 0.85; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 0.5rem; object-fit: contain; }
    .critical-badge { display: inline-flex; align-items: center; gap: 0.2rem; font-size: 0.65rem; font-weight: 700; color: #ea580c; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 9999px; padding: 0.1rem 0.45rem; white-space: nowrap; }
  </style>
</head>
<body>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="" />
  <p class="text-white text-xs opacity-60">Click anywhere to close</p>
</div>

<div id="loading-screen" class="hidden max-w-lg mx-auto px-6 py-24 text-center">
  <p class="text-gray-400 text-sm">Loading feedback…</p>
</div>

<div id="error-screen" class="hidden max-w-lg mx-auto px-6 py-24 text-center">
  <p class="text-gray-400 text-sm">No feedback data found. Make sure you copied the full URL.</p>
</div>

<div id="main" class="hidden max-w-3xl mx-auto px-6 py-10 space-y-6">

  <!-- Header -->
  <div class="space-y-1">
    <p class="text-xs text-gray-400 uppercase tracking-wide font-semibold">Ponto QA Tagger Test</p>
    <h1 class="text-2xl font-bold text-gray-900">Feedback</h1>
  </div>

  <!-- Score cards -->
  <div id="score-cards" class="flex flex-wrap gap-3"></div>

  <!-- Intro note -->
  <div class="bg-blue-50 border border-blue-200 rounded-lg px-4 py-3 text-sm text-blue-800">
    Below are the items where your answers differed from the correct answer key.
    Review each one carefully — the correct tag and any notes from the reviewer are shown.
  </div>

  <!-- Items -->
  <div id="items-list" class="space-y-4"></div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLqCcIkx38nCnnqbm4ZMULzX0Q1SZSaRsMurHTAz5GuvA4Vx9RoNd2iDxar2LLDr4WkQ/exec';

const ITEM_WEIGHTS = {
  'a0a8ecc9-5989-b30c-0cc8-7c42de99bbe2': 3,
  '663d9437-887b-36b5-968f-ed977896d1b1': 3,
  '3f2ef186-aabd-7361-ade4-61d8795e6bfa': 3,
  '72375624-07ff-0662-a3c2-4586f0ccd856': 3,
  'd1ff4d44-dc43-58ee-947f-3e8c4bde3746': 3,
  '0ee2b8b6-29f4-6ace-a5b5-19db2903ef61': 3,
};

function tagClass(tag) {
  const map = { ready: 'ready', design: 'design', regenerate: 'regenerate', newinput: 'newinput', flagged: 'flagged' };
  return map[tag] || 'empty';
}
function tagLabel(tag) {
  const map = { ready: 'Ready', design: 'Design Review', regenerate: 'Regenerate', newinput: 'New Input', flagged: 'Flag' };
  return map[tag] || (tag || '—');
}

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

async function load() {
  const params = new URLSearchParams(location.search);
  const cParam = params.get('c');

  if (cParam) {
    // New mode: ?c=Name1,Name2 — fetch live from sheet
    document.getElementById('loading-screen').classList.remove('hidden');
    try {
      const names = cParam.split(',').map(s => s.trim()).filter(Boolean);
      const resp = await fetch(SCRIPT_URL);
      const data = await resp.json();
      const payload = buildPayload(names, data.submissions || [], data.master || {});
      document.getElementById('loading-screen').classList.add('hidden');
      render(payload);
    } catch(e) {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('error-screen').classList.remove('hidden');
    }
    return;
  }

  // Legacy: #hash
  try {
    const hash = location.hash.slice(1);
    if (!hash) throw new Error('empty');
    let payload;
    try {
      const b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
      const binary = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const json = fflate.strFromU8(fflate.inflateSync(binary));
      payload = JSON.parse(json);
    } catch {
      payload = JSON.parse(decodeURIComponent(escape(atob(hash))));
    }
    render(payload);
  } catch(e) {
    document.getElementById('error-screen').classList.remove('hidden');
  }
}

function buildPayload(names, submissions, master) {
  const subs = submissions.filter(s => names.includes(s.tester_name));
  const template = subs[0]?.items || [];

  const wrongItems = template
    .filter(item => {
      const m = master[item.place_id];
      if (!m?.tag) return false;
      return subs.some(s => {
        const a = s.items.find(i => i.place_id === item.place_id);
        return a?.tag !== m.tag;
      });
    })
    .map(item => {
      const m = master[item.place_id];
      return {
        place_id:   item.place_id,
        place_name: item.place_name,
        address:    item.address,
        input_url:  item.input_url,
        output_url: item.output_url,
        correct:    m.tag,
        note:       m.comment || '',
        candidates: subs.map(s => {
          const a = s.items.find(i => i.place_id === item.place_id);
          return { name: s.tester_name, tag: a?.tag || '', comment: a?.comment || '' };
        }),
      };
    });

  const candidates = subs.map(s => {
    const correct = template.filter(item => {
      const m = master[item.place_id];
      const a = s.items.find(i => i.place_id === item.place_id);
      return m?.tag && a?.tag === m.tag;
    }).length;
    return { name: s.tester_name, email: s.tester_email || '', correct, total: template.length };
  });

  return { candidates, items: wrongItems };
}

function render(payload) {
  const candidates = payload.candidates || [];
  const items      = payload.items      || [];

  document.getElementById('main').classList.remove('hidden');

  const names = candidates.map(c => c.name).join(', ');
  document.title = `Feedback — ${names}`;

  // Score cards
  const scoreContainer = document.getElementById('score-cards');
  candidates.forEach(c => {
    const haScore = c.correct != null && c.total;
    const pct = haScore ? Math.round(c.correct / c.total * 100) : null;
    const color = pct == null ? '#94a3b8' : pct >= 80 ? '#15803d' : pct >= 60 ? '#a16207' : '#b91c1c';
    const card = document.createElement('div');
    card.style.cssText = 'background:white;border:1px solid #e2e8f0;border-radius:0.75rem;padding:0.875rem 1.25rem;min-width:160px;';
    card.innerHTML = `
      <p style="font-size:0.8rem;font-weight:600;color:#1e293b;margin-bottom:0.25rem;">${c.name}</p>
      ${c.email ? `<p style="font-size:0.7rem;color:#94a3b8;margin-bottom:0.5rem;">${c.email}</p>` : ''}
      ${haScore ? `
        <p style="font-size:1.5rem;font-weight:700;color:${color};line-height:1;">${pct}%</p>
        <p style="font-size:0.7rem;color:#94a3b8;margin-top:0.15rem;">${c.correct} / ${c.total} correct</p>
      ` : ''}
    `;
    scoreContainer.appendChild(card);
  });

  const container = document.getElementById('items-list');
  items.forEach((item, idx) => {
    const isCritical = !!ITEM_WEIGHTS[item.place_id];
    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl border overflow-hidden ' + (isCritical ? 'border-orange-300' : 'border-gray-200');
    if (isCritical) card.style.borderLeftWidth = '3px';
    card.innerHTML = `
      <div class="px-5 py-4 border-b ${isCritical ? 'border-orange-100 bg-orange-50/40' : 'border-gray-50'} flex items-center gap-3">
        <span class="text-xs text-gray-300 font-mono w-5 text-right flex-shrink-0">${idx + 1}</span>
        <div class="flex items-center gap-2 flex-wrap">
          ${isCritical ? '<span class="critical-badge">⚠ Critical</span>' : ''}
          <div>
            <p class="font-semibold text-gray-900 text-sm">${item.place_name || item.place_id}</p>
            <p class="text-xs text-gray-400">${item.address || ''}</p>
          </div>
        </div>
      </div>
      <div class="px-5 py-4 flex gap-4 flex-wrap">
        <div class="flex gap-2 flex-shrink-0">
          ${item.input_url  ? `<div class="space-y-1 text-center"><p class="text-xs text-gray-400">Input</p><img class="item-img" src="${item.input_url}"  onclick="openLightbox('${item.input_url}')"  /></div>` : ''}
          ${item.output_url ? `<div class="space-y-1 text-center"><p class="text-xs text-gray-400">Output</p><img class="item-img" src="${item.output_url}" onclick="openLightbox('${item.output_url}')" /></div>` : ''}
        </div>
        <div class="flex-1 min-w-0 space-y-3">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-semibold text-gray-500">Correct answer:</span>
            <span class="tag-badge tag-${tagClass(item.correct)}">${tagLabel(item.correct)}</span>
          </div>
          <div class="space-y-1">
            ${(item.candidates || []).map(c => {
              if (!c.tag) return '';
              const wrong = c.tag !== item.correct;
              return `<div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs text-gray-500 w-28 truncate">${c.name}:</span>
                <span class="tag-badge tag-${tagClass(c.tag)}" style="${wrong ? 'opacity:0.75;' : ''}">${tagLabel(c.tag)}</span>
                <span class="text-xs ${wrong ? 'text-red-400' : 'text-green-500'}">${wrong ? '✗ wrong' : '✓ correct'}</span>
                ${c.comment ? `<span class="text-xs text-gray-400 italic">"${c.comment}"</span>` : ''}
              </div>`;
            }).join('')}
          </div>
          ${item.note ? `<div class="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2.5 mt-2">
            <p class="text-xs font-semibold text-amber-700 mb-1">Reviewer note</p>
            <p class="text-sm text-amber-900 whitespace-pre-wrap">${item.note}</p>
          </div>` : ''}
        </div>
      </div>`;
    container.appendChild(card);
  });
}

window.addEventListener('load', load);
</script>
</body>
</html>
